name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint --recursive
        continue-on-error: false

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check --recursive

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: type-check

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jhaz_imprints_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mongodb:
        image: mongo:7-alpine
        env:
          MONGO_INITDB_DB: jhaz_imprints_test
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/jhaz_imprints_test
        run: |
          cd packages/db
          pnpm exec prisma migrate deploy || true

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/jhaz_imprints_test
          DATABASE_URL: postgresql://test:test@localhost:5432/jhaz_imprints_test
          MONGODB_URI: mongodb://localhost:27017/jhaz_imprints_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key
          PAYSTACK_SECRET_KEY: sk_test_xxxxx
          PAYSTACK_PUBLIC_KEY: pk_test_xxxxx
          EMAIL_USER: test@example.com
          EMAIL_PASSWORD: test-password
          EMAIL_FROM: noreply@jhaz-imprints.com
          CLOUDINARY_CLOUD_NAME: test-cloud
          CLOUDINARY_API_KEY: test-key
          CLOUDINARY_API_SECRET: test-secret
          TWILIO_ACCOUNT_SID: ACtest
          TWILIO_AUTH_TOKEN: test-token
          TWILIO_WHATSAPP_FROM: +1234567890
          TAILOR_PHONE: +2348033130603
          CLIENT_URL: http://localhost:3000
          NODE_ENV: test
        run: pnpm run test --recursive

      - name: Generate coverage
        if: success()
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/jhaz_imprints_test
          DATABASE_URL: postgresql://test:test@localhost:5432/jhaz_imprints_test
          MONGODB_URI: mongodb://localhost:27017/jhaz_imprints_test
        run: pnpm run test:coverage --recursive || true

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build --recursive

      - name: Verify builds
        run: |
          [ -d "packages/api/dist" ] || exit 1
          [ -d "apps/web/.next" ] || exit 1
          [ -d "apps/admin/dist" ] || exit 1
