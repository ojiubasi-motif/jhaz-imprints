# packages/catalog-service/docker-compose.dev.yml
# NOTE: this is just to view the mongodb database; it doesn't have any effect on the running catalog service===

# add it to the .env first if you want custom credentials
# then spin up just mongo-express in the terminal
#run cmd::
# docker compose -f packages/catalog-service/docker-compose.yml -f packages/catalog-service/docker-compose.dev.yml up mongo-express
services:
  mongo-express:
    image: mongo-express:latest
    container_name: catalog-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${MONGODB_URI}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS:-pass}
    depends_on:
      atlas-healthcheck:
        condition: service_completed_successfully
    networks:
      - catalog-net